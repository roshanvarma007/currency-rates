name: update-rates
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rates
        run: |
          curl -fsSL "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json" -o tmp.json
          jq -e '.usd' tmp.json > /dev/null
          mv tmp.json rates.json
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git commit -m "update rates $(date -u +%F)" || exit 0
          git push
